name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Generate Official Xcode Project from Swift Package
        run: |
          swift package generate-xcodeproj --output TPMSinoiOS.xcodeproj

      - name: Build iOS App with Xcode
        run: |
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS-Package \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Create Real iOS .app Bundle Package
        run: |
          mkdir -p dist
          APP_PATH=$(find build -name "TPMSinoiOS.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          cp -R -L "$APP_PATH" dist/
          
          echo "=== CHECKING REAL APP BUNDLE CONTENTS & FILE SIZE ==="
          ls -lh dist/TPMSinoiOS.app/
          du -sh dist/TPMSinoiOS.app/
          
          cd dist
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          
          echo "=== FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
