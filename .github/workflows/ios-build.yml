name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee build_output.log

      - name: Locate and Copy Real Compiled .app Bundle
        run: |
          APP_PATH=$(find build -name "TPMSinoiOS.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate TPMSinoiOS.app directory!"
            exit 1
          fi
          cp -R -L "$APP_PATH" "$GITHUB_WORKSPACE/TPMSinoiOS.app"
          echo "=== CHECKING REAL APP BUNDLE CONTENTS & FILE SIZE ==="
          ls -la "$GITHUB_WORKSPACE/TPMSinoiOS.app/"
          du -sh "$GITHUB_WORKSPACE/TPMSinoiOS.app/"

      - name: Compress .app Bundle into app.zip
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -r -9 app.zip TPMSinoiOS.app
          echo "=== CHECKING FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
