name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee build_output.log

      - name: Locate All Compiled Binaries & App Bundles
        run: |
          echo "=== SEARCHING FOR ALL BINARIES & FILES > 100KB IN BUILD DIR ==="
          find build -type f -size +100k -exec ls -lh {} + || true
          echo "=== SEARCHING FOR EXECUTABLE BINARY NAMED TPMSinoiOS ==="
          find build -name "TPMSinoiOS" -exec ls -lh {} + || true
          echo "=== SEARCHING FOR ALL .app DIRECTORIES ==="
          find build -name "*.app" -exec ls -ld {} + || true

      - name: Compress .app Bundle into app.zip
        run: |
          APP_PATH=$(find build -name "TPMSinoiOS.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/real_app"
          cp -R -L "$APP_PATH" "$GITHUB_WORKSPACE/real_app/"
          cd "$GITHUB_WORKSPACE/real_app"
          echo "=== CONTENTS OF COPIED APP BUNDLE ==="
          ls -la TPMSinoiOS.app/
          du -sh TPMSinoiOS.app/
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          echo "=== FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
