name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee build_output.log

      - name: Locate Real App Bundle Inside DerivedData and Package app.zip
        run: |
          REAL_APP_DIR=$(find /Users/runner/Library/Developer/Xcode/DerivedData build -name "TPMSinoiOS.app" -type d 2>/dev/null | head -n 1)
          echo "Found Real App Directory: $REAL_APP_DIR"
          
          mkdir -p "$GITHUB_WORKSPACE/dist/TPMSinoiOS.app"
          cp -R -L "$REAL_APP_DIR/." "$GITHUB_WORKSPACE/dist/TPMSinoiOS.app/"
          
          echo "=== CHECKING PHYSICAL DIST CONTENTS & SIZES ==="
          ls -la "$GITHUB_WORKSPACE/dist/TPMSinoiOS.app/"
          du -sh "$GITHUB_WORKSPACE/dist/TPMSinoiOS.app/"
          
          cd "$GITHUB_WORKSPACE/dist"
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          
          cd "$GITHUB_WORKSPACE"
          echo "=== CHECKING FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
