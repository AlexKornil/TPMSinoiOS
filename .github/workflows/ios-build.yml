name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build_output.log

      - name: Create Physical iOS .ipa Application Archive
        run: |
          mkdir -p Payload
          cp -R -L build/Build/Products/Debug-iphonesimulator/TPMSinoiOS.app Payload/
          echo "=== PAYLOAD CONTENTS ==="
          ls -la Payload/TPMSinoiOS.app/
          echo "=== PAYLOAD SIZE ==="
          du -sh Payload/TPMSinoiOS.app/
          zip -r -9 TPMSinoiOS.ipa Payload
          ls -lh TPMSinoiOS.ipa

      - name: Upload iOS App IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-IPA
          path: TPMSinoiOS.ipa
          retention-days: 30
