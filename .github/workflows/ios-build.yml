name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Compile Swift App Binary with Swift Package Manager
        run: |
          swift build -c release --triple arm64-apple-ios15.0-simulator

      - name: Create Real iOS .app Bundle Package
        run: |
          mkdir -p dist/TPMSinoiOS.app
          BINARY_PATH=$(find .build -name "TPMSinoiOS" -type f | grep -v "\.d" | head -n 1)
          echo "Found compiled Swift binary at: $BINARY_PATH"
          cp "$BINARY_PATH" dist/TPMSinoiOS.app/
          cp TPMSinoiOS/Info.plist dist/TPMSinoiOS.app/
          
          echo "=== CHECKING REAL APP BUNDLE CONTENTS & FILE SIZE ==="
          ls -lh dist/TPMSinoiOS.app/
          du -sh dist/TPMSinoiOS.app/
          
          cd dist
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          
          echo "=== FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
