name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build_output.log

      - name: Locate All Compiled TPMSinoiOS Files Across Entire Mac
        run: |
          echo "=== SEARCHING ENTIRE MAC FOR TPMSinoiOS ==="
          find /Users/runner -name "TPMSinoiOS*" -exec ls -lh {} + 2>/dev/null || true

      - name: Compress Real Compiled App Bundle into app.zip
        run: |
          REAL_APP_DIR=$(find /Users/runner -name "TPMSinoiOS.app" -type d 2>/dev/null | grep -v "DerivedData" | head -n 1)
          if [ -z "$REAL_APP_DIR" ]; then
            REAL_APP_DIR=$(find /Users/runner -name "TPMSinoiOS.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Real App Dir: $REAL_APP_DIR"
          
          mkdir -p "$GITHUB_WORKSPACE/real_app"
          cp -R -L "$REAL_APP_DIR" "$GITHUB_WORKSPACE/real_app/"
          cd "$GITHUB_WORKSPACE/real_app"
          echo "=== REAL APP CONTENTS & SIZE ==="
          ls -la TPMSinoiOS.app/
          du -sh TPMSinoiOS.app/
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          echo "=== FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
