name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build_output.log

      - name: Compress .app Bundle into app.zip and app.tar.gz
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          echo "=== CHECKING CONTENTS OF TPMSinoiOS.app ==="
          ls -la TPMSinoiOS.app
          du -sh TPMSinoiOS.app
          
          # Create app.zip containing TPMSinoiOS.app
          zip -r "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          
          # Create app.tar.gz containing TPMSinoiOS.app
          tar -czf "$GITHUB_WORKSPACE/app.tar.gz" TPMSinoiOS.app
          
          cd "$GITHUB_WORKSPACE"
          ls -lh app.zip app.tar.gz

      - name: Upload app.zip Artifact for Appetize.io
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30

      - name: Upload app.tar.gz Artifact for Appetize.io
        uses: actions/upload-artifact@v4
        with:
          name: app-tar-gz
          path: app.tar.gz
          retention-days: 30
