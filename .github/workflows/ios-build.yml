name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package Real iOS App into .ipa
        run: |
          REAL_APP=$(python3 -c "import os; print(os.path.realpath('build/Build/Products/Release-iphonesimulator/TPMSinoiOS.app'))")
          echo "Resolved Real App Path: $REAL_APP"
          
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R -L "$REAL_APP" "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app"
          
          echo "=== PAYLOAD APP BUNDLE CONTENTS & FILE SIZES ==="
          ls -la "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app/"
          du -sh "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app/"
          file "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app/TPMSinoiOS" || true

          cd "$GITHUB_WORKSPACE"
          zip -r -9 TPMSinoiOS.ipa Payload/
          echo "=== FINAL IPA FILE SIZE ==="
          ls -lh TPMSinoiOS.ipa
          du -sh TPMSinoiOS.ipa

      - name: Upload TPMSinoiOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-IPA
          path: TPMSinoiOS.ipa
          retention-days: 30
