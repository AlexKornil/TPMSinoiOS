name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Create Real iOS .app Bundle Package
        run: |
          mkdir -p dist
          APP_PATH=$(find build -name "TPMSinoiOS.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          cp -R -L "$APP_PATH" dist/
          
          echo "=== CHECKING REAL APP BUNDLE CONTENTS & FILE SIZE ==="
          ls -lh dist/TPMSinoiOS.app/
          du -sh dist/TPMSinoiOS.app/
          
          cd dist
          zip -r -9 "$GITHUB_WORKSPACE/TPMSinoiOS.app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          
          echo "=== FINAL APP.ZIP FILE SIZE ==="
          ls -lh TPMSinoiOS.app.zip
          du -sh TPMSinoiOS.app.zip

      - name: Upload TPMSinoiOS.app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-App-Zip
          path: TPMSinoiOS.app.zip
          retention-days: 30
