name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' || true)
          if [ -n "$SIM_ID" ]; then
            DEST="id=$SIM_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 15"
          fi
          echo "Selected Destination: $DEST"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Compress Compiled App Artifact
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r TPMSinoiOS.app.zip TPMSinoiOS.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-App
          path: build/Build/Products/Debug-iphonesimulator/TPMSinoiOS.app.zip
          retention-days: 30
