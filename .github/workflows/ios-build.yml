name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Physical iOS Release IPA on GitHub Virtual Mac
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: xcodegen generate

      - name: Build Physical iOS Release Application
        run: |
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package Release IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -9 TPMSinoiOS-Release.ipa Payload
          
          IPA_SIZE=$(stat -f%z TPMSinoiOS-Release.ipa 2>/devnull || stat -c%s TPMSinoiOS-Release.ipa)
          echo "=== FINAL RELEASE IPA SIZE: $IPA_SIZE bytes ==="
          ls -lh TPMSinoiOS-Release.ipa

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-Release-IPA
          path: TPMSinoiOS-Release.ipa
          retention-days: 30
