name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Inspect and Print All Built Products
        run: |
          echo "=== PRINTING ALL BUILT FILES IN BUILD PRODUCTS ==="
          find build/Build/Products/ -maxdepth 5 -ls || true

      - name: Package Full Build Products Directory
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/TPMSinoiOS-Products.zip" .
          ls -lh "$GITHUB_WORKSPACE/TPMSinoiOS-Products.zip"

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-Products-App
          path: TPMSinoiOS-Products.zip
          retention-days: 30
