name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee build_output.log

      - name: Inspect and Package Real App Bundle
        run: |
          REAL_APP=$(python3 -c "import os; print(os.path.realpath('build/Build/Products/Debug-iphonesimulator/TPMSinoiOS.app'))")
          echo "Resolved Real App Path: $REAL_APP"
          mkdir -p "$GITHUB_WORKSPACE/real_app"
          cp -R -L "$REAL_APP" "$GITHUB_WORKSPACE/real_app/"
          
          echo "=== CHECKING REAL COPIED APP CONTENTS & FILE SIZES ==="
          ls -la "$GITHUB_WORKSPACE/real_app/TPMSinoiOS.app/"
          du -sh "$GITHUB_WORKSPACE/real_app/TPMSinoiOS.app/"
          file "$GITHUB_WORKSPACE/real_app/TPMSinoiOS.app/TPMSinoiOS" || true

      - name: Compress Real App Bundle into app.zip
        run: |
          cd "$GITHUB_WORKSPACE/real_app"
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          echo "=== FINAL APP.ZIP FILE SIZE ==="
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-Installer
          path: app.zip
          retention-days: 30
