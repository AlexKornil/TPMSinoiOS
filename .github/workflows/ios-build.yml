name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project with XcodeGen
        run: xcodegen generate

      - name: Build iOS App with Xcode
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Available iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build > build_output.log 2>&1 || {
              echo "xcodebuild failed"
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git add build_output.log
              git commit -m "Upload build log [skip ci]"
              git push
              exit 1
            }

      - name: Inspect and Package Real App Bundle
        run: |
          REAL_APP=$(find build -name "TPMSinoiOS.app" -type d | head -n 1)
          echo "Found Real App Directory: $REAL_APP"
          
          echo "=== EXECUTABLE BINARY CONTENTS & FILE SIZE ==="
          ls -la "$REAL_APP/"
          du -sh "$REAL_APP/"
          file "$REAL_APP/TPMSinoiOS" || true
          
          mkdir -p dist
          cp -R -L "$REAL_APP" dist/
          cd dist
          zip -r -9 "$GITHUB_WORKSPACE/app.zip" TPMSinoiOS.app
          cd "$GITHUB_WORKSPACE"
          
          ZIP_SIZE=$(stat -f%z app.zip 2>/dev/null || stat -c%s app.zip)
          echo "=== FINAL APP.ZIP FILE SIZE: $ZIP_SIZE bytes ==="
          if [ "$ZIP_SIZE" -lt 50000 ]; then
            echo "Error: app.zip size is too small ($ZIP_SIZE bytes). Build failed to produce a valid app binary."
            exit 1
          fi
          
          ls -lh app.zip
          du -sh app.zip

      - name: Upload app.zip Artifact for Appetize.io & Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: app-zip
          path: app.zip
          retention-days: 30
