name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App with Xcode
        run: |
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package Real iOS App into .ipa
        run: |
          REAL_APP=$(python3 -c "import os; print(os.path.realpath('build/Build/Products/Release-iphoneos/TPMSinoiOS.app'))")
          echo "Resolved Real App Path: $REAL_APP"
          
          # Check if the app directory actually exists and has contents
          if [ ! -d "$REAL_APP" ]; then
            echo "Error: App directory not found at $REAL_APP"
            exit 1
          fi
          
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R -L "$REAL_APP" "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app"
          
          echo "=== PAYLOAD APP BUNDLE CONTENTS & FILE SIZES ==="
          ls -la "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app/"
          du -sh "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app/"
          file "$GITHUB_WORKSPACE/Payload/TPMSinoiOS.app/TPMSinoiOS" || true

          cd "$GITHUB_WORKSPACE"
          zip -r -9 TPMSinoiOS.ipa Payload/
          
          # Check zip size. If it's suspiciously small (e.g. < 500KB), fail the build.
          ZIP_SIZE=$(stat -f%z TPMSinoiOS.ipa 2>/dev/null || stat -c%s TPMSinoiOS.ipa)
          echo "=== FINAL IPA FILE SIZE: $ZIP_SIZE bytes ==="
          if [ "$ZIP_SIZE" -lt 512000 ]; then
            echo "Error: IPA size is suspiciously small ($ZIP_SIZE bytes). The build likely failed to produce a real app."
            exit 1
          fi
          
          ls -lh TPMSinoiOS.ipa
          du -sh TPMSinoiOS.ipa

      - name: Upload TPMSinoiOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-IPA
          path: TPMSinoiOS.ipa
          retention-days: 30
