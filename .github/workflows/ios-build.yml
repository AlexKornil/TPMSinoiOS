name: Build TPMSino iOS App

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build iOS App on GitHub Virtual Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App for iPhone Device
        run: |
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package iOS Device App (.zip)
        run: |
          cd build_device/Build/Products/Release-iphoneos
          zip -r "$GITHUB_WORKSPACE/TPMSinoiOS-Device.app.zip" TPMSinoiOS.app
          ls -lh "$GITHUB_WORKSPACE/TPMSinoiOS-Device.app.zip"

      - name: Build iOS App for Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          xcodebuild \
            -project TPMSinoiOS.xcodeproj \
            -scheme TPMSinoiOS \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package iOS Simulator App (.zip)
        run: |
          cd build_sim/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/TPMSinoiOS-Simulator.app.zip" TPMSinoiOS.app
          ls -lh "$GITHUB_WORKSPACE/TPMSinoiOS-Simulator.app.zip"

      - name: Upload Device App Artifact (For iPhone SE)
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-Device-App
          path: TPMSinoiOS-Device.app.zip
          retention-days: 30

      - name: Upload Simulator App Artifact (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: TPMSinoiOS-Simulator-App
          path: TPMSinoiOS-Simulator.app.zip
          retention-days: 30
